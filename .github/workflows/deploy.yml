name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Separate jobs so deploy-pages reliably finds the uploaded artifact (actions/deploy-pages#451)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js img levels pasquil-opus pasquil-astra .nojekyll _site/

      - name: Configure scoreboard
        if: ${{ vars.FIREBASE_API_KEY != '' && vars.FIREBASE_DATABASE_URL != '' }}
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: |
          jq -n --arg apiKey "$FIREBASE_API_KEY" --arg databaseURL "$FIREBASE_DATABASE_URL" \
            '{apiKey: $apiKey, databaseURL: $databaseURL}' \
            | { printf 'window.SCOREBOARD_CONFIG = '; cat; printf ';\n'; } > _site/js/scoreboard-config.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
