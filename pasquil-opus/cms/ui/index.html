<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Pasquil CMS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/cms/font.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/cms/app.css" />
    <script type="module" src="/cms/app.js"></script>
  </head>
  <body>
    <div class="app" id="app" data-view="edit">
      <aside class="side" id="side" aria-label="Bestanden">
        <div class="side__brand">
          <img src="/favicon.svg" alt="" width="28" height="28" />
          <span class="side__name">Pasquil</span>
          <span class="side__tag">CMS</span>
          <button class="icon-btn side__close" id="sideClose" type="button" aria-label="Menu sluiten">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
        </div>
        <label class="side__search">
          <span class="sr-only">Zoek een pagina</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <input id="fileFilter" type="search" placeholder="Zoek een pagina…" autocomplete="off" />
        </label>
        <nav class="side__nav" id="fileNav"></nav>
        <div class="side__foot">
          <button class="btn btn--yellow btn--block" id="buildBtn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" /></svg>
            <span>Site bouwen</span>
          </button>
          <p class="side__hint" id="buildHint">Maakt de map <code>dist/</code> klaar om te publiceren.</p>
        </div>
      </aside>
      <div class="scrim" id="scrim" hidden></div>

      <main class="main">
        <header class="bar">
          <button class="icon-btn bar__menu" id="sideOpen" type="button" aria-label="Bestanden tonen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="bar__title">
            <p class="bar__group" id="fileGroup"></p>
            <h1 id="fileTitle">Laden…</h1>
            <code class="bar__path" id="filePath"></code>
          </div>
          <span class="status" id="status" role="status"></span>
          <div class="bar__actions">
            <button class="btn btn--ghost" id="findBtn" type="button" title="Zoek een tekst (⌘K)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
              <span class="hide-sm">Zoek tekst</span><kbd class="hide-sm">⌘K</kbd>
            </button>
            <button class="btn btn--ghost" id="historyBtn" type="button" title="Eerdere versies">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5M12 7v5l3 2" /></svg>
              <span class="hide-md">Geschiedenis</span>
            </button>
            <button class="btn btn--ghost" id="revertBtn" type="button" title="Niet-opgeslagen wijzigingen weggooien" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg>
              <span class="hide-md">Ongedaan maken</span>
            </button>
            <button class="btn btn--yellow" id="saveBtn" type="button" title="Opslaan (⌘S)" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7" /></svg>
              <span>Opslaan</span>
            </button>
          </div>
        </header>

        <nav class="tabs" id="related" aria-label="Bestanden op deze pagina" hidden></nav>

        <div class="work" id="work">
          <section class="editor" id="editor" aria-label="Teksten bewerken">
            <div class="editor__inner" id="form"></div>
          </section>
          <div class="split" id="split" role="separator" aria-orientation="vertical" aria-label="Breedte aanpassen" tabindex="0"></div>
          <section class="preview" id="preview" aria-label="Voorbeeld">
            <div class="pbar">
              <div class="seg" role="group" aria-label="Schermgrootte">
                <button type="button" data-device="desktop" aria-pressed="true" title="Desktop (1280px)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5" /><path d="M8 20h8M12 16v4" /></svg>
                  <span class="sr-only">Desktop</span>
                </button>
                <button type="button" data-device="tablet" aria-pressed="false" title="Tablet (820px)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2" /><path d="M11 18h2" /></svg>
                  <span class="sr-only">Tablet</span>
                </button>
                <button type="button" data-device="mobile" aria-pressed="false" title="Mobiel (390px)">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2" /><path d="M11 18.5h2" /></svg>
                  <span class="sr-only">Mobiel</span>
                </button>
              </div>
              <button class="tool" id="pointBtn" type="button" aria-pressed="false" title="Klik op een tekst in het voorbeeld om hem te bewerken">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3l14 8-6 1.5L10 19z" /></svg>
                <span>Aanwijzen</span>
              </button>
              <code class="pbar__url" id="previewUrl"></code>
              <span class="pbar__note" id="previewNote" hidden></span>
              <button class="tool tool--icon" id="reloadBtn" type="button" title="Voorbeeld herladen">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8" /><path d="M20 3v5h-5" /></svg>
                <span class="sr-only">Herladen</span>
              </button>
              <a class="tool tool--icon" id="openBtn" href="/" target="_blank" rel="noopener" title="Openen in nieuw tabblad">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9" /><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" /></svg>
                <span class="sr-only">Openen in nieuw tabblad</span>
              </a>
            </div>
            <div class="stage" id="stage">
              <div class="device" id="device"><iframe id="frame" title="Voorbeeld van de pagina"></iframe></div>
              <div class="stage__loading" id="frameLoading"><span class="spinner"></span></div>
            </div>
          </section>
        </div>

        <nav class="switch" aria-label="Weergave">
          <button type="button" data-view="edit" aria-pressed="true">Bewerken</button>
          <button type="button" data-view="preview" aria-pressed="false">Voorbeeld</button>
        </nav>
      </main>
    </div>

    <dialog class="dialog dialog--finder" id="finder" aria-label="Zoek een tekst">
      <form method="dialog" class="finder">
        <label class="finder__field">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" /></svg>
          <span class="sr-only">Zoek in alle teksten</span>
          <input id="finderInput" type="search" placeholder="Zoek in alle teksten en pagina’s…" autocomplete="off" />
          <kbd>esc</kbd>
        </label>
        <ul class="finder__list" id="finderList" role="listbox" aria-label="Resultaten"></ul>
        <p class="finder__empty" id="finderEmpty" hidden>Geen resultaten.</p>
      </form>
    </dialog>

    <dialog class="dialog dialog--history" id="history" aria-labelledby="historyTitle">
      <div class="dialog__head">
        <h2 id="historyTitle">Geschiedenis</h2>
        <button class="icon-btn" type="button" data-close aria-label="Sluiten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <div class="history">
        <ul class="history__list" id="historyList"></ul>
        <div class="history__detail" id="historyDetail">
          <p class="muted">Kies een versie om te zien wat er anders is dan nu.</p>
        </div>
      </div>
    </dialog>

    <dialog class="dialog dialog--small" id="linkDialog" aria-labelledby="linkTitle">
      <form method="dialog" class="linkform" id="linkForm">
        <h2 id="linkTitle">Link</h2>
        <label class="fld">
          <span class="fld__label">Adres (URL, /pagina/ of mailto:)</span>
          <input class="inp" id="linkHref" type="text" autocomplete="off" spellcheck="false" required />
        </label>
        <label class="check">
          <input type="checkbox" id="linkBlank" />
          <span>Openen in een nieuw tabblad</span>
        </label>
        <div class="linkform__actions">
          <button class="btn btn--ghost" type="button" id="linkRemove">Link verwijderen</button>
          <span class="grow"></span>
          <button class="btn btn--ghost" value="cancel" formnovalidate>Annuleren</button>
          <button class="btn btn--yellow" value="ok" id="linkOk">Toepassen</button>
        </div>
      </form>
    </dialog>

    <dialog class="dialog dialog--log" id="buildDialog" aria-labelledby="buildTitle">
      <div class="dialog__head">
        <h2 id="buildTitle">Build</h2>
        <button class="icon-btn" type="button" data-close aria-label="Sluiten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
      </div>
      <pre class="log" id="buildLog"></pre>
    </dialog>

    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
